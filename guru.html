<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Data Guru</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, sans-serif;
    color: #1f2937;
}

.container-page {
    padding: 30px;
}

.header-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.header-title {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
}

.header-subtitle {
    color: #6b7280;
    margin-top: 5px;
}

.data-card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.data-header {
    padding: 20px 25px;
    border-bottom: 1px solid #eee;
}

.table-responsive {
    padding: 0;
}

.table {
    margin-bottom: 0;
}

.table thead th {
    background: #f8fafc;
    padding: 16px;
    white-space: nowrap;
}

.table tbody td {
    padding: 15px;
    vertical-align: middle;
}

.action-btn {
    margin: 2px;
}

.loading {
    text-align: center;
    padding: 50px;
}

</style>

</head>


<body>


<div class="container-page">


<div class="header-card">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

<div>

<h1 class="header-title">
<i class="bi bi-person-workspace"></i>
Data Guru
</h1>

<div class="header-subtitle">
Kelola data guru SMK Teuku Umar Semarang
</div>

</div>


<button
    class="btn btn-primary"
    onclick="openAddGuru()"
>

<i class="bi bi-person-plus"></i>
Tambah Guru

</button>

</div>

</div>



<div class="data-card">


<div class="data-header d-flex justify-content-between align-items-center">

<div>

<strong>Daftar Guru</strong>

<div
    id="guruCount"
    class="text-muted small"
>
Memuat...
</div>

</div>


<button
    class="btn btn-outline-secondary btn-sm"
    onclick="loadGuru()"
>

<i class="bi bi-arrow-clockwise"></i>

Refresh

</button>

</div>



<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>NIP</th>
<th>Nama</th>
<th>Jabatan</th>
<th>No HP</th>
<th>Face</th>
<th>Aksi</th>

</tr>

</thead>


<tbody id="guruTableBody">

<tr>

<td
    colspan="8"
    class="loading"
>

<div class="spinner-border text-primary"></div>

<div class="mt-2">
Memuat data guru...
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<!-- MODAL -->

<div
    class="modal fade"
    id="guruModal"
    tabindex="-1"
>

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5
    class="modal-title"
    id="guruModalTitle"
>
Tambah Guru
</h5>

<button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
></button>

</div>


<div class="modal-body">

<input
    type="hidden"
    id="guruId"
>


<div class="mb-3">

<label class="form-label">
NIP
</label>

<input
    id="guruNip"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Nama
</label>

<input
    id="guruNama"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Jabatan
</label>

<input
    id="guruJabatan"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
No HP
</label>

<input
    id="guruNoHp"
    class="form-control"
>

</div>

</div>


<div class="modal-footer">

<button
    class="btn btn-secondary"
    data-bs-dismiss="modal"
>
Batal
</button>

<button
    class="btn btn-primary"
    onclick="saveGuru()"
>

<i class="bi bi-save"></i>
Simpan

</button>

</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="guru.js"></script>

</body>

</html>
