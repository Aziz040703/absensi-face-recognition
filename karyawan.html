<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Data Karyawan</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
>

<style>

body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, sans-serif;
}

.container-page {
    padding: 30px;
}

.header-card,
.data-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.header-card {
    padding: 25px;
    margin-bottom: 25px;
}

.header-title {
    font-size: 28px;
    font-weight: 700;
}

.header-subtitle {
    color: #6b7280;
}

.data-card {
    overflow: hidden;
}

.data-header {
    padding: 20px 25px;
    border-bottom: 1px solid #eee;
}

.table {
    margin-bottom: 0;
}

.table th {
    background: #f8fafc;
    white-space: nowrap;
}

.table td {
    vertical-align: middle;
}

.action-btn {
    margin: 2px;
}

.photo-thumb {
    width: 45px;
    height: 45px;
    object-fit: cover;
    border-radius: 50%;
}

</style>

</head>


<body>


<div class="container-page">


<div class="header-card">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

<div>

<div class="header-title">

<i class="bi bi-people"></i>
Data Karyawan

</div>

<div class="header-subtitle">
Kelola data karyawan SMK Teuku Umar Semarang
</div>

</div>


<button
    class="btn btn-primary"
    onclick="openAddKaryawan()"
>

<i class="bi bi-person-plus"></i>
Tambah Karyawan

</button>

</div>

</div>



<div class="data-card">


<div class="data-header d-flex justify-content-between">

<div>

<strong>Daftar Karyawan</strong>

<div
    id="karyawanCount"
    class="text-muted small"
>
Memuat...
</div>

</div>


<button
    class="btn btn-outline-secondary btn-sm"
    onclick="loadKaryawan()"
>

<i class="bi bi-arrow-clockwise"></i>
Refresh

</button>

</div>


<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>NIP</th>
<th>Nama</th>
<th>Divisi</th>
<th>Foto</th>
<th>Status</th>
<th>Face</th>
<th>Aksi</th>

</tr>

</thead>


<tbody id="karyawanTableBody">

<tr>

<td
    colspan="9"
    class="text-center py-5"
>

<div class="spinner-border text-primary"></div>

<div class="mt-2">
Memuat data karyawan...
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<!-- MODAL -->

<div
    class="modal fade"
    id="karyawanModal"
    tabindex="-1"
>

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5
    class="modal-title"
    id="karyawanModalTitle"
>
Tambah Karyawan
</h5>

<button
    class="btn-close"
    data-bs-dismiss="modal"
></button>

</div>


<div class="modal-body">

<input
    type="hidden"
    id="karyawanId"
>


<div class="mb-3">

<label class="form-label">
NIP
</label>

<input
    id="karyawanNip"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Nama
</label>

<input
    type="text"
    id="karyawanNama"
    name="nama"
    class="form-control"
    required
>

</div>


<div class="mb-3">

<label class="form-label">
Divisi
</label>

<input
    id="karyawanDivisi"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Foto
</label>

<input
    id="karyawanFoto"
    class="form-control"
    placeholder="URL foto"
>

</div>


<div class="mb-3">

<label class="form-label">
Status
</label>

<select
    id="karyawanStatus"
    class="form-select"
>

<option value="Aktif">
Aktif
</option>

<option value="Nonaktif">
Nonaktif
</option>

</select>

</div>

</div>


<div class="modal-footer">

<button
    class="btn btn-secondary"
    data-bs-dismiss="modal"
>
Batal
</button>

<button
    class="btn btn-primary"
    onclick="saveKaryawan()"
>

<i class="bi bi-save"></i>
Simpan

</button>

</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="config.js"></script>
<script src="Api.js"></script>
<script src="Karyawan.js"></script>

</body>

</html>
